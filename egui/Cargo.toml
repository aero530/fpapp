[package]
name = "fpapp-egui"
version = "5.0.0"
edition.workspace = true

[[bin]]
name = "fpapp-egui"
path = "src/main.rs"

[dependencies]
eframe = "0.35.0"
egui_plot = "0.36.0"
rfd = "0.17.2"
accounts = { path = "../accounts" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
image = { workspace = true, features = ["png"] }

[dev-dependencies]
egui_kittest = { version = "0.35", default-features = false }

[package]
name = "fpapp-egui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fpapp-egui"
path = "src/main.rs"

[dependencies]
eframe = "0.35.0"
egui_plot = "0.36.0"
rfd = "0.17.2"
accounts = { path = "../accounts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25.10", features = ["png"], default-features = false }

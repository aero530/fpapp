# Publish the WebAssembly build to GitHub Pages as the online demo.
#
# The demo tracks `main`, so whatever is on the default branch is what visitors get.
# https://aero530.github.io/fpapp/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress stays false deliberately: a half-cancelled
# deployment is worse than a queued one, and these runs are minutes apart at most.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # cache-bin is off on purpose. By default rust-cache also caches ~/.cargo/bin, which is
      # where build.sh installs the wasm-bindgen CLI -- and a restored copy of that binary is
      # what broke this workflow once already, arriving on PATH in a state where it would not
      # execute. Compiled dependencies are the part worth caching; reinstalling one small
      # prebuilt binary per run costs seconds.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      # build.sh reads the required wasm-bindgen CLI version out of Cargo.lock and installs it
      # if it is missing -- the CLI and the crate have to match exactly or the build fails with
      # a schema error. cargo-binstall makes that a download rather than a source build.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      # Pinned and checksummed rather than `apt-get install binaryen`, which is not a cosmetic
      # preference: Ubuntu's binaryen is old enough to contain a multi-table reindexing bug that
      # silently produces a valid, smaller, broken module. It repoints the __wbindgen_externrefs
      # export at the fixed-size funcref table, and the app then dies on load with
      # "failed to grow table by 4". v131 is verified to get this right.
      #
      # wasm-opt itself is optional to build.sh; it takes another ~22% off the module that every
      # visitor downloads.
      - name: Install wasm-opt (binaryen, pinned)
        run: |
          version=131
          sha256=b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db
          url=https://github.com/WebAssembly/binaryen/releases/download/version_$version/binaryen-version_$version-x86_64-linux.tar.gz
          curl -sSfL -o binaryen.tar.gz "$url"
          echo "$sha256  binaryen.tar.gz" | sha256sum -c -
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_$version/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz

      - name: Build
        run: ./egui/web/build.sh

      # A partial or subtly-broken build deploys as a blank page that says "Loading Financial
      # Planner..." forever, which looks like a working site to every check except opening it.
      #
      # build.sh instantiates the finished module and grows its externref table, failing the
      # build if that does not work -- but it skips that check when node is missing, so node
      # being present is asserted here to keep the gate from quietly turning itself off.
      - name: Check the build is complete
        run: |
          command -v node >/dev/null || { echo "::error::node is required to verify the module starts"; exit 1; }
          cd egui/web/dist
          for f in index.html fpapp.js fpapp_bg.wasm icon-256.png; do
            test -f "$f" || { echo "::error::$f is missing from the build"; exit 1; }
          done
          # A wasm module this app's size is megabytes; anything under one is a broken build,
          # not a small one.
          size=$(stat -c%s fpapp_bg.wasm)
          test "$size" -gt 1000000 || { echo "::error::fpapp_bg.wasm is only $size bytes"; exit 1; }
          echo "fpapp_bg.wasm is $((size / 1024)) KB"

      # Apache-specific and meaningless here: Pages serves the artifact through its own CDN,
      # which already sends application/wasm and compresses on the fly.
      - name: Drop the Apache config
        run: rm -f egui/web/dist/.htaccess

      # enablement: true points the repository's Pages source at Actions on the first run, so
      # this does not need a manual visit to Settings > Pages to work.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: egui/web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

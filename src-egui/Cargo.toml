[package]
name = "fpapp-egui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fpapp-egui"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui_plot = "0.29"
rfd = "0.15"
accounts = { path = "../src-tauri/src/accounts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
